[package]
name = "emergence-tauri"
version = "0.6.0"
description = "Emergence"
authors = ["eric@holochain.org"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"
resolver = "2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.2.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.5.1", features = ["devtools"] }
# Pinned to a runtime-tauri commit until tauri-plugin-hc is on crates.io. Keep the
# rev in step with the runtime-tauri input in flake.lock. Fetched over SSH while
# runtime-tauri is private (see .cargo/config.toml).
tauri-plugin-hc = { git = "ssh://git@github.com/holochain/runtime-tauri.git", rev = "8c4f5d2762077aec850235c6aed41f55c77270c9" }
# default-features = false keeps the cranelift JIT out of iOS builds. The wasm
# backend is chosen per target by holochain-conductor-runtime and unifies here.
holochain = { version = "0.7.0", default-features = false, features = ["encryption", "schema"] }

log = "0.4"
tauri-plugin-log = "2.4.0"
tauri-plugin-opener = "2.2.7"
tauri-plugin-os = "2.2.1"
anyhow = "1"

# To build against a local runtime-tauri checkout, uncomment this and enter the
# dev shell with: nix develop --override-input runtime-tauri git+file:///path/to/runtime-tauri
# [patch."ssh://git@github.com/holochain/runtime-tauri.git"]
# tauri-plugin-hc = { path = "../../runtime-tauri/crates/tauri-plugin-hc" }
# holochain-conductor-runtime = { path = "../../runtime-tauri/crates/runtime" }

# Optimize dependencies in dev builds (`tauri dev`). Unoptimized, the conductor,
# wasmer/cranelift and lair make a first launch and every new clone cell's first
# zome call take tens of seconds: measured 29.6 s vs 2.9 s for a new clone's first
# call, 19.7 s vs 1.7 s for boot. Emergence's own crate stays unoptimized, so
# rebuilds after editing it stay fast; the first dev build takes longer, once.
#
# debug = false drops dependency debug info, which otherwise makes the Android
# debug library ~1.3 GB (1.18 GB of it DWARF, 68 MB of code) and too big to install
# on an emulator. Dependency symbols stay, so backtraces keep function names.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
